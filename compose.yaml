name: pdf-analyzer
services:
  lab:
    build: .
    image: pdf-analyzer:local
    init: true
    ports:
      - "127.0.0.1:${LAB_PORT:-8080}:8766"
    volumes:
      - lab-data:/workspace
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  lab-data:
