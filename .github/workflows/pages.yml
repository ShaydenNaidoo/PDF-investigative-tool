name: Publish PDF Analyzer interface
on:
  push:
    branches: [main]
    paths:
      - 'pdf-analyzer/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser scripts
        run: |
          node --check pdf-analyzer/app.js
          node --check pdf-analyzer/hosting.js
          node --check pdf-analyzer/pdf-export.js
      - name: Build interface only
        run: python3 pdf-analyzer/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-build
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
