# Free service: workspace changes are lost on sleep, restart or redeploy.
# Optional Google Drive backup/restore: see GOOGLE_DRIVE.md; credentials stay in Render.
services:
  - type: web
    name: pdf-investigative-lab
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: PDF_LAB_REMOTE
        value: "1"
      - key: PDF_LAB_EPHEMERAL
        value: "1"
      - key: PDF_LAB_ACCESS_KEY
        generateValue: true
      - key: PDF_LAB_ALLOWED_ORIGINS
        value: https://shaydennaidoo.github.io
