# Paid service + disk: review Render's quoted price before creating the Blueprint.
services:
  - type: web
    name: pdf-investigative-lab
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    disk:
      name: pdf-lab-data
      mountPath: /workspace
      sizeGB: 10
    envVars:
      - key: LAB_RUNTIME_USER
        value: root
      - key: PDF_LAB_REMOTE
        value: "1"
      - key: PDF_LAB_ACCESS_KEY
        generateValue: true
      - key: PDF_LAB_ALLOWED_ORIGINS
        value: https://shaydennaidoo.github.io
